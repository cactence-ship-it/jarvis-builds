name: Rust orchestrator

on:
  push:
    branches: ["feat/rust-agent-orchestrator-plan"]
    paths:
      - "orchestrator/**"
      - "kartal-s-twin/tools/meshfit/**"
      - ".github/workflows/rust-orchestrator.yml"
  pull_request:
    paths:
      - "orchestrator/**"
      - "kartal-s-twin/tools/meshfit/**"
      - ".github/workflows/rust-orchestrator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # A check must be able to fail: keep --check here.
      - name: Format check
        run: cargo fmt --manifest-path orchestrator/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path orchestrator/Cargo.toml --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path orchestrator/Cargo.toml --locked
      - name: Offline smoke run
        run: cargo run --manifest-path orchestrator/Cargo.toml --locked
      - name: Offline panel run (mock partners, no network)
        env:
          KARTAL_TASK: "CI smoke: write and review a placeholder report"
        run: cargo run --manifest-path orchestrator/Cargo.toml --locked -- panel-run --author anthropic --mock
      - name: meshfit format check
        run: cargo fmt --manifest-path kartal-s-twin/tools/meshfit/Cargo.toml --check
      - name: meshfit clippy
        run: cargo clippy --manifest-path kartal-s-twin/tools/meshfit/Cargo.toml --locked --all-targets -- -D warnings
      - name: meshfit tests
        run: cargo test --manifest-path kartal-s-twin/tools/meshfit/Cargo.toml --locked
