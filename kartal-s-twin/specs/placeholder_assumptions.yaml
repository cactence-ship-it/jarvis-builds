# =============================================================================
# PLACEHOLDER ASSUMPTIONS - NOT VEHICLE EVIDENCE
# =============================================================================
# These values exist only so that the build pipeline can produce a VISUAL
# placeholder envelope before photos and measurements arrive. Rules (D-013):
#   * They are never copied into specs/kartal_s_1997.yaml.
#   * Any geometry that reads even one of them is automatically PLACEHOLDER
#     (enforced by kartal_twin.params.Resolver and the tests).
#   * When the spec gets a real (ESTIMATED/VERIFIED) value for a key listed
#     under `replaces`, the spec value wins automatically.
# Each entry states WHY the number was chosen, so it can be challenged and
# replaced once evidence exists. Numbers are proportion guesses for a
# 1970s-design three-box estate on a 2490 mm wheelbase - not measurements.

schema_version: 1
assumptions:
  # --- stand-ins for UNKNOWN spec parameters --------------------------------
  front_track:      {value: 1380, unit: mm, replaces: dimensions.front_track, rationale: "overall width 1642 minus 175 mm tire section minus ~45 mm body-to-tire clearance per side"}
  rear_track:       {value: 1350, unit: mm, replaces: dimensions.rear_track, rationale: "slightly narrower than front, typical for a live-axle RWD estate; pure guess"}
  front_overhang:   {value: 830,  unit: mm, replaces: dimensions.front_overhang, rationale: "split of literature length minus wheelbase (1906 mm); estates carry the longer overhang at the rear"}
  # --- body side profile (VCS: X rearward from front axle, Z up from ground) -
  bumper_protrusion:   {value: 60,  unit: mm, replaces: body_profile.bumper_protrusion, rationale: "bumper face ahead of / behind the body face"}
  bumper_height:       {value: 130, unit: mm, replaces: body_profile.bumper_height, rationale: "bar-type bumper of the era"}
  bumper_bottom_z:     {value: 300, unit: mm, replaces: body_profile.bumper_bottom_z, rationale: "proportion guess"}
  sill_z:              {value: 200, unit: mm, replaces: body_profile.sill_z, rationale: "body-side lower edge above ground"}
  nose_bottom_z:       {value: 300, unit: mm, replaces: body_profile.nose_bottom_z, rationale: "front lower edge"}
  nose_top_z:          {value: 760, unit: mm, replaces: body_profile.nose_top_z, rationale: "top edge of the front face (hood leading edge)"}
  cowl_x:              {value: 1060, unit: mm, replaces: body_profile.cowl_x, rationale: "windshield base behind the front axle"}
  belt_z:              {value: 960, unit: mm, replaces: body_profile.belt_z, rationale: "side-window sill (beltline) height"}
  rear_bottom_z:       {value: 420, unit: mm, replaces: body_profile.rear_bottom_z, rationale: "lower edge of the rear face"}
  windshield_top_x:    {value: 1660, unit: mm, replaces: body_profile.windshield_top_x, rationale: "gives a ~55 deg windshield rake typical of the period"}
  roof_rear_inset:     {value: 120, unit: mm, replaces: body_profile.roof_rear_inset, rationale: "roof ends this far ahead of the rear body face (near-vertical tailgate)"}
  tail_rear_inset:     {value: 25,  unit: mm, rationale: "greenhouse rear face inset at belt height"}
  greenhouse_inset_belt: {value: 45, unit: mm, rationale: "side glass inset from the body side at the beltline"}
  roof_width:          {value: 1362, unit: mm, replaces: body_profile.roof_width, rationale: "body width 1642 minus ~140 mm tumblehome per side"}
  b_pillar_x:          {value: 1760, unit: mm, replaces: body_profile.b_pillar_x, rationale: "front/rear door split"}
  c_pillar_x:          {value: 2600, unit: mm, replaces: body_profile.c_pillar_x, rationale: "rear door ends near the rear wheel arch"}
  pillar_width:        {value: 70,  unit: mm, rationale: "visible pillar / frame width around glass"}
  arch_clearance:      {value: 45,  unit: mm, rationale: "wheel-arch radius minus tire radius"}
  arch_depth:          {value: 260, unit: mm, rationale: "wheel-arch cut depth from the body side"}
  tire_static_deflection: {value: 12, unit: mm, rationale: "loaded radius = free radius minus deflection"}
  mirror_protrusion:   {value: 110, unit: mm, replaces: body_profile.mirror_protrusion, rationale: "mirror housing beyond the body side"}
  # --- appearance (colour is UNKNOWN; neutral grey signals 'not the real paint')
  paint_rgba:          {value: [0.11, 0.54, 0.50, 1.0], unit: null, rationale: "turquoise-green approximation of the registered colour name TURKUAZ YESIL (E-014, E-015, E-017); the RGB value itself is a guess, no paint code known"}
  # --- LPG tank position (visual only; CAD keeps the tank unplaced, D-016/D-026) ---------
  lpg_tank_centre_x: {value: 3150, unit: mm, replaces: lpg_system.tank_centre_x, rationale: "photos E-022 show the tank in the spare-wheel well at the rear of the luggage floor near the tailgate sill; the number itself is a guess (no scale)"}
  lpg_tank_centre_y: {value: 0, unit: mm, replaces: lpg_system.tank_centre_y, rationale: "on the centre line; pure guess"}
  lpg_tank_base_z:   {value: 350, unit: mm, replaces: lpg_system.tank_base_z, rationale: "on the luggage floor / well floor; load-floor height unknown; pure guess"}
  # --- mechanical package (VISUAL ONLY, all PLACEHOLDER; owner directive 2026-11-03) ------------
  # Layout guesses so the twin is a complete assembly. Photos E-022..E-028 fix only the ARRANGEMENT
  # (longitudinal engine, MacPherson front, rigid rear axle with a transverse rod, LHD, manual,
  # power steering, electric fan, battery in the engine bay, LPG tank in the spare-wheel well,
  # rear silencer beside it); every number below is a proportion guess, never a measurement.
  pkg_engine_x0:      {value: -150, unit: mm, rationale: "front face of the block; longitudinal engine mostly behind the front axle line (photos E-027); guess"}
  pkg_engine_len:     {value: 470,  unit: mm, rationale: "block length of a 4-cylinder 1.6 l; proportion guess"}
  pkg_crank_z:        {value: 300,  unit: mm, rationale: "crankshaft centre height; keeps the air cleaner under the hood line; guess"}
  pkg_block_half_w:   {value: 150,  unit: mm, rationale: "half width of the block; guess"}
  pkg_gearbox_len:    {value: 660,  unit: mm, rationale: "bellhousing + 5-speed-size case length (gear count UNKNOWN); guess"}
  pkg_radiator_x:     {value: -640, unit: mm, rationale: "radiator behind the grille (photos E-027); guess"}
  pkg_firewall_x:     {value: 1000, unit: mm, rationale: "rear wall of the engine bay just ahead of the cowl (body_profile.cowl_x 1060); guess"}
  pkg_floor_z:        {value: 215,  unit: mm, rationale: "cabin floor top just above the sill line (body_profile.sill_z 200); guess"}
  pkg_cargo_floor_z:  {value: 430,  unit: mm, rationale: "luggage floor above the rear axle, near the tailgate sill; guess"}
  pkg_well_floor_z:   {value: 330,  unit: mm, rationale: "spare-wheel well floor; well protrudes below the floor (photos E-025); guess"}
  pkg_front_rail_y:   {value: 380,  unit: mm, rationale: "half spacing of the front longitudinal members; guess"}
  pkg_strut_top_z:    {value: 700,  unit: mm, rationale: "MacPherson strut top mounts on the inner wings (photos E-027), below the hood; height guess"}
  pkg_strut_inset:    {value: 150,  unit: mm, rationale: "strut top inboard of the wheel centre; guess"}
  pkg_arm_inner_y:    {value: 330,  unit: mm, rationale: "front lower arm inner pivots; guess"}
  pkg_rear_spring_y:  {value: 520,  unit: mm, rationale: "rear spring position on the axle; spring TYPE is UNKNOWN (neutral envelope only); guess"}
  pkg_axle_tube_r:    {value: 38,   unit: mm, rationale: "rear axle tube radius; guess"}
  pkg_diff_r:         {value: 140,  unit: mm, rationale: "differential housing radius; guess"}
  pkg_exhaust_y:      {value: 220,  unit: mm, rationale: "exhaust run offset to the RH side of the tunnel; side and offset are guesses"}
  pkg_rear_silencer:  {value: [2800, 3300, 520, 230, 70], unit: mm, rationale: "x0, x1, y, z, radius: rear silencer beside the spare-wheel well (photos E-025); numbers guessed"}
  pkg_petrol_tank:    {value: [2560, 3300, -550, -340, 230, 480], unit: mm, rationale: "x0, x1, y0, y1, z0, z1: rectangular tank beside the well, inside the wheel-arch line (photos E-025); about 39 L envelope vs 52 L literature (E-010); guess"}
