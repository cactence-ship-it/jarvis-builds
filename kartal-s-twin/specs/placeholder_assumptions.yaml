  pkg_dash:           {value: [1060, 1300, 650, 900], unit: mm, rationale: "x0, x1, z0, z1 of the dashboard under the windshield base; guess"}
  pkg_steering_wheel: {value: [1360, -370, 870, 170], unit: mm, rationale: "x, y, z, radius: LHD (E-024), small aftermarket sport wheel (E-024); guess"}
  pkg_front_seat:     {value: [1650, 2150, 180, 680, 380, 500, 1080], unit: mm, rationale: "x0, x1, |y| inner, |y| outer, cushion z0, z1, backrest top z; guess"}
  pkg_rear_seat:      {value: [2300, 2760, 540, 400, 510, 1000], unit: mm, rationale: "x0, x1, |y| outer (between the rear wheel arches), cushion z0, z1, backrest top z (rear bench, E-024); guess"}
  pkg_pedals:         {value: [1150, -480, -260, 260, 450], unit: mm, rationale: "x, y of the clutch (LH), y of the accelerator (RH), z0, z1 (three pedals, E-024); guess"}
  pkg_gear_lever_x:   {value: 1180, unit: mm, rationale: "floor gear lever on the tunnel (E-024); guess"}
  pkg_handbrake_x:    {value: 1560, unit: mm, rationale: "handbrake lever between the front seats; guess"}
  pkg_harness_r:      {value: 9,    unit: mm, rationale: "visual radius of a wiring-harness bundle; routing is schematic, no pinout or wiring data"}
  pkg_brake_r:        {value: 115,  unit: mm, rationale: "brake envelope radius inside a 14 in wheel; front type (disc/drum) UNKNOWN, rear drum ESTIMATED; guess"}
  pkg_spare_wheel:    {value: [3000, 560], unit: mm, rationale: "x, y of the spare wheel standing upright on the RH side of the luggage compartment (photos E-022); numbers guessed"}
  roof_rail_height:   {value: 1570, unit: mm, replaces: dimensions.overall_height_roof_rails, rationale: "roof rails seen in the photos (E-026); about 74 mm above the 1496 mm literature roof height; guess"}
