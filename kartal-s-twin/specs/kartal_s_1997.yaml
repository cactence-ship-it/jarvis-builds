# =============================================================================
# Tofaş Kartal S (1997) - MASTER VEHICLE SPECIFICATION  (single source of truth)
# =============================================================================
# Every dimension / technical parameter used by CAD, assemblies or exports is read
# from this file. Hard rules (ENGINEERING_DECISIONS.md D-005, enforced by
# `python tools/twin.py validate`):
#   UNKNOWN   -> value: null, confidence: NONE, tolerance: null, verify_by set.
#   ESTIMATED -> value + evidence source(s) + tolerance > 0 for numeric values.
#   VERIFIED  -> confidence HIGH + a RECEIVED photo/document/measurement source.
#   Owner statements alone can never make a value VERIFIED.
#   NEVER enter a number from memory or a generic Kartal - only from evidence.
# Registration plate, VIN and engine number are deliberately NOT stored here:
# this repository is public (D-012).

schema_version: 1
revision: "0.8.0"
last_updated: 2026-11-02
vehicle_alias: VEH-01   # public alias for the owner's car (real registration withheld)

units:
  length: mm
  mass: kg
  angle: deg
  displacement: cm3
  power: kW
  torque: N·m
  speed: rpm
  volume: L
  voltage: V
  note: tolerance is always expressed in the parameter's own unit (± value)

coordinate_system:   # D-003
  id: VCS
  handedness: right
  x: {axis: longitudinal, positive: rearward}
  y: {axis: lateral, positive: right (seen from the driver's seat facing forward)}
  z: {axis: vertical, positive: up}
  origin:
    x: front wheel centre line (front axle) is X = 0
    y: vehicle centre plane is Y = 0
    z: ground plane at the reference state is Z = 0
  side_convention: LH side is -Y, RH side is +Y
  reference_state: null   # UNKNOWN - fuel level, load, tyre pressures; fix at first measurement (U-008)
  gltf_export: glTF (x, y, z) = VCS (-Y, Z, -X) x 0.001 m  -> vehicle front faces glTF +Z, up is +Y

