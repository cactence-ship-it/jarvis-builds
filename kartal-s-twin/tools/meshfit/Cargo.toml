[package]
name = "kartal-meshfit"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Fit generated meshes (e.g. Tripo GLB parts) to the Kartal S twin's resolved dimensions and report proportion consistency"
license = "MIT"

[dependencies]
# Std-only JSON from the orchestrator crate; no third-party crates.
kartal-agent-orchestrator = { path = "../../../orchestrator" }

[[bin]]
name = "meshfit"
path = "src/main.rs"

[lib]
name = "kartal_meshfit"
path = "src/lib.rs"
