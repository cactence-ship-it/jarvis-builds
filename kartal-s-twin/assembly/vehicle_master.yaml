# VEHICLE_MASTER - component inventory and assembly structure (source of truth)
# =============================================================================
# COMPONENT_INVENTORY.md is generated from this file: `python tools/twin.py inventory`.
# Component fields:
#   fitment              CONFIRMED | UNCONFIRMED | ABSENT on THIS vehicle
#   optional             true = may legitimately be absent on this vehicle
#   verification_status  VERIFIED | ESTIMATED | UNKNOWN (same rules as the spec, D-005)
#   source_refs          evidence IDs from EVIDENCE_REGISTER.md (E-003 = where evidence is expected)
#   geometry             status per representation - visual / cad / mechanical are separate (D-006):
#                        NONE | PLACEHOLDER | LEGACY_IMPORT | DRAFT | VALIDATED
#   dependencies         components this one mounts to or needs (must be acyclic)
#   history              append {rev, date, change} on every change - never rewrite old entries

